<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发图片到电脑 · PhonePad</title>
<style>*{box-sizing:border-box}body{margin:0;padding:22px 16px;background:#f2f5fa;color:#172b46;font:16px/1.6 system-ui,sans-serif}main{max-width:600px;margin:auto}h1{font-size:25px;margin:16px 0 6px}.hint{color:#66758a;font-size:14px}.card{background:white;border:1px solid #e2e8f1;border-radius:16px;padding:20px;margin:18px 0}input{max-width:100%;font:inherit}button{background:#315fe9;color:white;padding:13px 20px;border:0;border-radius:10px;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:#315fe9}progress{width:100%;height:16px}#preview{display:flex;overflow:auto;gap:8px;margin:16px 0}#preview img{width:100px;height:100px;object-fit:contain;background:#f2f5fa;border-radius:8px}#status{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#18734b}.error{color:#ab3434}</style>
<main><a id="back">← 返回手机输入页</a><h1>发图片到电脑</h1><p class="hint">沿用当前连接，无需再扫码。选择照片后点击发送。</p><section class="card"><label for="files">选择一张或多张图片</label><p><input id="files" type="file" multiple accept="image/png,image/jpeg,image/webp"></p><div id="preview"></div><button id="send" disabled>发送到电脑</button><p><progress id="progress" max="100" value="0"></progress></p><div id="status" role="status" aria-live="polite">等待选择图片。</div></section><p class="hint">支持 JPG、PNG、WebP，每张不超过 20 MB。成功后在电脑 PhonePad 点“查看手机传来的图片”；语音工作台点“打开收到的图片”。</p></main>
<script>
const token=new URLSearchParams(location.search).get('t')||'';
document.getElementById('back').href='/?t='+encodeURIComponent(token);
const files=document.getElementById('files'), send=document.getElementById('send'), statusEl=document.getElementById('status'), progress=document.getElementById('progress');
let previews=[];
function status(text,kind=''){statusEl.textContent=text;statusEl.className=kind;}
files.addEventListener('change',()=>{
  previews.forEach(u=>URL.revokeObjectURL(u)); previews=[];
  const target=document.getElementById('preview');target.replaceChildren();
  for(const file of Array.from(files.files).slice(0,12)){const img=document.createElement('img');const url=URL.createObjectURL(file);previews.push(url);img.src=url;target.appendChild(img);}
  send.disabled=!files.files.length;status('已选择 '+files.files.length+' 张，点击“发送到电脑”。');progress.value=0;
});
function upload(file){return new Promise((resolve,reject)=>{
  if(file.size>20*1024*1024){reject(new Error('超过 20 MB'));return;}
  const xhr=new XMLHttpRequest();xhr.open('POST','/upload?t='+encodeURIComponent(token));xhr.timeout=120000;
  xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');
  xhr.upload.onprogress=e=>{if(e.lengthComputable)progress.value=Math.round(e.loaded/e.total*100);};
  xhr.onload=()=>{let data;try{data=JSON.parse(xhr.responseText);}catch(e){reject(new Error('服务器响应异常（HTTP '+xhr.status+'），请保留此提示反馈'));return;}
    if(xhr.status>=200&&xhr.status<300&&data.ok)resolve(data);else reject(new Error(data.error==='token'?'连接参数失效，请从原输入页重新进入':data.error||'HTTP '+xhr.status));};
  xhr.onerror=()=>reject(new Error('网络连接中断，请确认电脑服务仍在运行，并保持当前热点连接'));
  xhr.ontimeout=()=>reject(new Error('发送超时，请保持页面在前台后重试'));
  xhr.send(file);
});}
send.addEventListener('click',async()=>{
  const selected=Array.from(files.files);if(!selected.length)return;
  send.disabled=true;files.disabled=true;const failed=[];let ok=0;
  for(let i=0;i<selected.length;i++){
    progress.value=0;status('正在发送 '+(i+1)+' / '+selected.length+'：'+selected[i].name);
    try{await upload(selected[i]);ok++;}catch(e){failed.push(selected[i].name+'：'+e.message);}
  }
  status('电脑已收到 '+ok+' / '+selected.length+' 张图片。'+(failed.length?'\n发送失败：\n'+failed.join('\n'):'\n请在电脑打开“收到的图片”查看。'),failed.length?'error':'ok');
  files.disabled=false;send.disabled=false;send.textContent=failed.length?'重新发送所选图片':'再次发送所选图片';
});
</script></html>
